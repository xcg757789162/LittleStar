# ============================================================
# LittleStar 两容器部署 — docker-compose.yml
# 架构: littlestar-db (PostgreSQL) + littlestar-app (All-in-One)
# ============================================================

services:
  # ============================================================
  # PostgreSQL 16 — 独立数据库容器
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: littlestar-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-littlestar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 数据持久化
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本（按文件名顺序执行，仅首次创建数据库时运行）
      - ../postgresql/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../postgresql/init/02-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ../postgresql/init/03-rls.sql:/docker-entrypoint-initdb.d/03-rls.sql:ro
      - ../postgresql/init/04-seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
      - ../postgresql/init/05-seed-activities.sql:/docker-entrypoint-initdb.d/05-seed-activities.sql:ro
      - ../postgresql/init/06-seed-curricula.sql:/docker-entrypoint-initdb.d/06-seed-curricula.sql:ro
      - ../postgresql/init/07-add-parent-pin.sql:/docker-entrypoint-initdb.d/07-add-parent-pin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-littlestar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - littlestar-net

  # ============================================================
  # All-in-One 应用容器
  # 内含: Nginx + PostgREST + Auth Service + OpenMAIC
  # 由 supervisord 管理多进程
  # ============================================================
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        # 可自定义 OpenMAIC 源码仓库和分支
        OPENMAIC_REPO: ${OPENMAIC_REPO:-https://github.com/THU-MAIC/OpenMAIC.git}
        OPENMAIC_BRANCH: ${OPENMAIC_BRANCH:-main}
    container_name: littlestar-app
    environment:
      # --- 数据库连接 ---
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-littlestar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-littlestar}
      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # --- PostgREST ---
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-littlestar}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000
      PGRST_DB_POOL: 10
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_SERVER_HOST: "0.0.0.0"
      # --- Auth Service ---
      AUTH_PORT: 3001
      # --- OpenMAIC ---
      OPENMAIC_PORT: ${OPENMAIC_PORT:-3002}
      PORT: ${OPENMAIC_PORT:-3002}
      # --- LLM / TTS / 图片生成 (透传给 OpenMAIC) ---
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      TTS_MINIMAX_API_KEY: ${TTS_MINIMAX_API_KEY:-}
      IMAGE_QWEN_IMAGE_API_KEY: ${IMAGE_QWEN_IMAGE_API_KEY:-}
      IMAGE_QWEN_IMAGE_BASE_URL: ${IMAGE_QWEN_IMAGE_BASE_URL:-}
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # OpenMAIC 数据 & 日志
      - openmaic-data:/app/openmaic/data
      - openmaic-logs:/app/openmaic/logs
      # 媒体文件静态服务
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    networks:
      - littlestar-net

# ============================================================
# 持久化卷
# ============================================================
volumes:
  pgdata:
    driver: local
  openmaic-data:
    driver: local
  openmaic-logs:
    driver: local
  media-data:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  littlestar-net:
    driver: bridge
