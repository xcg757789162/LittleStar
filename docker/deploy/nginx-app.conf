# ============================================================
# Nginx 反向代理配置 — LittleStar All-in-One 容器内部
# 所有 upstream 指向 localhost（同容器内通信）
# ============================================================

upstream auth_service {
    server 127.0.0.1:3001;
}

upstream postgrest {
    server 127.0.0.1:3000;
}

upstream openmaic {
    server 127.0.0.1:3002;
}

upstream pregeneration {
    server 127.0.0.1:3003;
}

server {
    listen 80;
    server_name _;

    # 关闭绝对重定向 — 当容器内部监听 80 但宿主机映射到 8080 时，
    # Nginx 自动 trailing-slash 301 重定向会生成 http://localhost/...（丢端口）
    # 设为 off 后，重定向使用相对路径，浏览器会保留当前 origin 的端口
    absolute_redirect off;

    # 请求体大小限制 — 对齐上游 OpenMAIC 的 200MB（classroomData JSON + base64 音频/图片）
    client_max_body_size 200m;

    # ============================================================
    # Auth Service 路由: /api/auth/* → localhost:3001/auth/*
    # ============================================================
    location /api/auth/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # PostgREST 路由: /api/rest/* → localhost:3000/*
    # ============================================================
    location /api/rest/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

        proxy_pass http://postgrest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # iframe 桥接脚本静态文件
    # ============================================================
    location = /iframe-bridge.js {
        alias /etc/nginx/iframe-bridge.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin '*' always;
    }

    # ============================================================
    # OpenMAIC 服务路由: /openmaic/* → localhost:3002/*
    # ============================================================
    location /openmaic/ {
        proxy_pass http://openmaic/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 移除上游响应中的 iframe 限制 headers
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # 允许 iframe 嵌入
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173 http://localhost:4173" always;

        # iframe 桥接脚本 + 图片生成自动启用注入
        sub_filter '</head>' '<script>try{var k="settings-storage",s=localStorage.getItem(k);if(s){var d=JSON.parse(s);if(d&&d.state){d.state.autoConfigApplied=false;d.state.imageGenerationEnabled=true;localStorage.setItem(k,JSON.stringify(d))}}}catch(e){}</script><script src="/iframe-bridge.js"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
    }

    # ============================================================
    # Next.js 静态资源路由
    # ============================================================
    location /_next/ {
        proxy_pass http://openmaic/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # OpenMAIC 前端内部资源（iframe 中的绝对路径请求）
    # ============================================================
    location /avatars/ {
        proxy_pass http://openmaic/avatars/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /logo-horizontal.png {
        proxy_pass http://openmaic/logo-horizontal.png;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # OpenMAIC 内部 API（iframe 内 Next.js 前端的请求）
    location /api/classroom {
        proxy_pass http://openmaic/api/classroom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/server-providers {
        proxy_pass http://openmaic/api/server-providers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Pre-Generation API: /api/pre-generate/* → localhost:3003
    # ============================================================
    location /api/pre-generate/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        proxy_pass http://pregeneration/api/pre-generate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 预生成任务可能耗时较长
        proxy_read_timeout 120s;
    }

    # OpenMAIC SSE 流式 API（chat、outlines 等长连接）
    # 必须禁用 proxy_buffering 以支持实时 SSE 推送，并延长超时以匹配上游 maxDuration
    location /api/chat {
        proxy_pass http://openmaic/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /api/generate/scene-outlines-stream {
        proxy_pass http://openmaic/api/generate/scene-outlines-stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # OpenMAIC 其他内部 API 通配符代理
    location /api/ {
        proxy_pass http://openmaic/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # OpenMAIC 图片/上传/公共资源代理
    location /images/ {
        proxy_pass http://openmaic/images/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        proxy_pass http://openmaic/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /public/ {
        proxy_pass http://openmaic/public/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        proxy_pass http://openmaic/favicon.ico;
        proxy_set_header Host $host;
        expires 30d;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"littlestar-app"}';
    }

    # ============================================================
    # 媒体文件静态服务: /media/* → /data/media/*
    # ============================================================
    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin '*' always;

        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            video/mp4 mp4;
        }
    }

    # ============================================================
    # LittleStar 前端静态资源（Vite 构建产物，带 hash 的长缓存）
    # ============================================================
    location /assets/ {
        alias /app/frontend/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # 默认: LittleStar 前端 SPA fallback
    # 前端静态文件由 Nginx 直接服务，未匹配的路径回退到 index.html
    # ============================================================
    location / {
        root /app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 不缓存（确保每次获取最新版本）
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
