; ============================================================
; supervisord.conf — LittleStar All-in-One 多进程管理
; 管理: PostgREST + Auth Service + OpenMAIC + Nginx
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; ============================================================
; PostgREST — 自动 REST API (端口 3000)
; ============================================================
[program:postgrest]
command=/usr/local/bin/postgrest
environment=PGRST_DB_URI="%(ENV_PGRST_DB_URI)s",PGRST_DB_SCHEMAS="%(ENV_PGRST_DB_SCHEMAS)s",PGRST_DB_ANON_ROLE="%(ENV_PGRST_DB_ANON_ROLE)s",PGRST_JWT_SECRET="%(ENV_PGRST_JWT_SECRET)s",PGRST_SERVER_PORT="%(ENV_PGRST_SERVER_PORT)s",PGRST_DB_POOL="%(ENV_PGRST_DB_POOL)s",PGRST_DB_POOL_ACQUISITION_TIMEOUT="%(ENV_PGRST_DB_POOL_ACQUISITION_TIMEOUT)s",PGRST_SERVER_HOST="%(ENV_PGRST_SERVER_HOST)s"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/postgrest-stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/postgrest-stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
priority=100

; ============================================================
; Auth Service — JWT 认证服务 (端口 3001)
; ============================================================
[program:auth-service]
command=node /app/auth-service/dist/index.js
directory=/app/auth-service
environment=AUTH_PORT="%(ENV_AUTH_PORT)s",JWT_SECRET="%(ENV_JWT_SECRET)s",JWT_EXPIRES_IN="%(ENV_JWT_EXPIRES_IN)s",DATABASE_URL="%(ENV_DATABASE_URL)s"
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/auth-stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/auth-stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
priority=200

; ============================================================
; OpenMAIC — AI 课堂生成服务 (端口 3002)
; Next.js standalone 模式：node server.js
; 环境变量 HOSTNAME + PORT 控制监听地址
; ============================================================
[program:openmaic]
command=node /app/openmaic/server.js
directory=/app/openmaic
environment=PORT="%(ENV_OPENMAIC_PORT)s",HOSTNAME="0.0.0.0",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/openmaic-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/openmaic-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=300

; ============================================================
; Nginx — 反向代理网关 (端口 80)
; 等其他服务启动后再启动
; ============================================================
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
priority=900
