# ============================================================
# PostgREST Configuration
# ============================================================

# 数据库连接 URI（由 Docker Compose 环境变量注入）
db-uri = "$(PGRST_DB_URI)"

# 暴露的 schema
db-schemas = "api"

# 匿名角色（未携带 JWT 时使用）
db-anon-role = "anon"

# JWT 验证密钥（必须与 Auth Service 的 JWT_SECRET 一致）
jwt-secret = "$(PGRST_JWT_SECRET)"

# 服务端口
server-port = 3000

# 服务监听地址
server-host = "0.0.0.0"

# 连接池大小
db-pool = 10

# 连接池超时（秒）
db-pool-acquisition-timeout = 10

# 自动更新 schema 缓存（开发时有用）
db-channel-enabled = true
