# ============================================================
# Nginx 反向代理配置 — LittleStar 统一入口
# ============================================================

upstream auth_service {
    server auth-service:3001;
}

upstream postgrest {
    server postgrest:3000;
}

upstream openmaic {
    server openmaic:3002;
}

# 根据请求方法决定是否为 OPTIONS 预检
map $request_method $is_options {
    OPTIONS 1;
    default 0;
}

server {
    listen 80;
    server_name _;

    # 请求体大小限制（classroomData JSON 可能较大）
    client_max_body_size 10m;

    # ============================================================
    # CORS 预检请求统一处理
    # ============================================================
    location @cors_preflight {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
    }

    # ============================================================
    # Auth Service 路由: /api/auth/* → auth-service:3001/auth/*
    # ============================================================
    location /api/auth/ {
        if ($is_options) {
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # PostgREST 路由: /api/rest/* → postgrest:3000/*
    # ============================================================
    location /api/rest/ {
        if ($is_options) {
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

        proxy_pass http://postgrest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # OpenMAIC 服务路由: /openmaic/* → openmaic:3002/*
    # 特殊处理 iframe 相关 headers
    # ============================================================
    location /openmaic/ {
        proxy_pass http://openmaic/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 移除上游响应中的 iframe 限制 headers
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # 允许 iframe 嵌入：同源 + Vite 开发服务器
        # 使用 CSP frame-ancestors 替代 X-Frame-Options（更灵活，支持多来源）
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173 http://localhost:4173" always;
    }

    # ============================================================
    # Next.js 静态资源路由: /_next/* → openmaic:3002/_next/*
    # OpenMAIC (Next.js) 的页面在 iframe 中通过 /openmaic/ 加载，
    # 但 Next.js 前端内部引用静态资源时使用绝对路径 /_next/static/...
    # 不带 /openmaic 前缀，所以需要单独代理。
    # ============================================================
    location /_next/ {
        proxy_pass http://openmaic/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # OpenMAIC 前端内部资源（iframe 中的绝对路径请求）
    # Next.js 前端在 iframe 中运行时，会请求 /avatars/、/logo-*
    # 以及 /api/classroom、/api/server-providers 等，
    # 这些路径都不带 /openmaic 前缀。
    # ============================================================
    location /avatars/ {
        proxy_pass http://openmaic/avatars/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /logo-horizontal.png {
        proxy_pass http://openmaic/logo-horizontal.png;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # OpenMAIC 内部 API（iframe 内 Next.js 前端的请求）
    # 注意：仅代理 OpenMAIC 特有的端点，不与 LittleStar 的 /api/auth/ 和 /api/rest/ 冲突
    location /api/classroom {
        proxy_pass http://openmaic/api/classroom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/server-providers {
        proxy_pass http://openmaic/api/server-providers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    # ============================================================
    # 媒体文件静态服务: /media/* → /data/media/*
    # 用于服务器端缓存的课堂图片/音频文件
    # ============================================================
    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin '*' always;

        # 常见媒体类型
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            video/mp4 mp4;
        }
    }

    # ============================================================
    # 默认: 返回 404
    # ============================================================
    location / {
        add_header Content-Type application/json;
        return 404 '{"error":"not_found","message":"Route not found"}';
    }
}
