# ============================================================
# Nginx 反向代理配置 — LittleStar 统一入口
# ============================================================

upstream auth_service {
    server auth-service:3001;
}

upstream postgrest {
    server postgrest:3000;
}

upstream openmaic {
    server openmaic:3002;
}

server {
    listen 80;
    server_name _;

    # 请求体大小限制（classroomData JSON 可能较大）
    client_max_body_size 10m;

    # ============================================================
    # CORS 统一处理
    # ============================================================
    # 对 OPTIONS 预检请求统一返回 204
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
    }

    # 全局 CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

    # ============================================================
    # Auth Service 路由: /api/auth/* → auth-service:3001/auth/*
    # ============================================================
    location /api/auth/ {
        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # PostgREST 路由: /api/rest/* → postgrest:3000/*
    # ============================================================
    location /api/rest/ {
        proxy_pass http://postgrest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # OpenMAIC 服务路由: /openmaic/* → openmaic:3002/*
    # 特殊处理 iframe 相关 headers
    # ============================================================
    location /openmaic/ {
        proxy_pass http://openmaic/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 移除上游响应中的 iframe 限制 headers
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # 允许同源 iframe 嵌入
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # ============================================================
    # 媒体文件静态服务: /media/* → /data/media/*
    # 用于服务器端缓存的课堂图片/音频文件
    # ============================================================
    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin '*' always;

        # 常见媒体类型
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            video/mp4 mp4;
        }
    }

    # ============================================================
    # 默认: 返回 404
    # ============================================================
    location / {
        return 404 '{"error":"not_found","message":"Route not found"}';
        add_header Content-Type application/json;
    }
}
