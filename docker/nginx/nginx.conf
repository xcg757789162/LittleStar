# ============================================================
# Nginx 反向代理配置 — LittleStar 统一入口
# ============================================================

upstream auth_service {
    server auth-service:3001;
}

upstream postgrest {
    server postgrest:3000;
}

upstream openmaic {
    server openmaic:3002;
}

# 根据请求方法决定是否为 OPTIONS 预检
map $request_method $is_options {
    OPTIONS 1;
    default 0;
}

server {
    listen 80;
    server_name _;

    # 请求体大小限制 — 对齐上游 OpenMAIC 的 200MB（classroomData JSON + base64 音频/图片）
    client_max_body_size 200m;

    # ============================================================
    # CORS 预检请求统一处理
    # ============================================================
    location @cors_preflight {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
    }

    # ============================================================
    # Auth Service 路由: /api/auth/* → auth-service:3001/auth/*
    # ============================================================
    location /api/auth/ {
        if ($is_options) {
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # PostgREST 路由: /api/rest/* → postgrest:3000/*
    # ============================================================
    location /api/rest/ {
        if ($is_options) {
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Prefer, Content-Profile, Accept-Profile, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Content-Length' always;

        proxy_pass http://postgrest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # OpenMAIC 服务路由: /openmaic/* → openmaic:3002/*
    # ============================================================
    location /openmaic/ {
        proxy_pass http://openmaic/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Next.js 静态资源路由: /_next/* → openmaic:3002/_next/*
    # OpenMAIC (Next.js) 的前端资源使用绝对路径 /_next/static/...
    # 需要单独代理。
    # ============================================================
    location /_next/ {
        proxy_pass http://openmaic/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # OpenMAIC 内部资源（绝对路径请求代理）
    # OpenMAIC (Next.js) 前端请求 /avatars/、/logo-* 等资源
    # 使用绝对路径（不带 /openmaic 前缀），需要单独代理。
    # ============================================================
    location /avatars/ {
        proxy_pass http://openmaic/avatars/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /logo-horizontal.png {
        proxy_pass http://openmaic/logo-horizontal.png;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # OpenMAIC 内部 API 代理
    # 注意：/api/auth/ 和 /api/rest/ 已在前面精确匹配，这里不会冲突
    # 代理所有 OpenMAIC 内部 API（包括 /api/classroom、
    # /api/server-providers、/api/tts、/api/generate-image 等）
    location /api/classroom {
        proxy_pass http://openmaic/api/classroom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/server-providers {
        proxy_pass http://openmaic/api/server-providers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenMAIC SSE 流式 API（chat、outlines 等长连接）
    location /api/chat {
        proxy_pass http://openmaic/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /api/generate/scene-outlines-stream {
        proxy_pass http://openmaic/api/generate/scene-outlines-stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # OpenMAIC 其他内部 API 通配符代理
    location /api/ {
        proxy_pass http://openmaic/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # OpenMAIC 图片资源代理
    location /images/ {
        proxy_pass http://openmaic/images/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # OpenMAIC 上传文件代理（AI 生成的图片/音频等）
    location /uploads/ {
        proxy_pass http://openmaic/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # OpenMAIC 公共静态资源代理
    location /public/ {
        proxy_pass http://openmaic/public/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # OpenMAIC favicon 和其他根级静态文件
    location /favicon.ico {
        proxy_pass http://openmaic/favicon.ico;
        proxy_set_header Host $host;
        expires 30d;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    # ============================================================
    # 媒体文件静态服务: /media/* → /data/media/*
    # 用于服务器端缓存的课堂图片/音频文件
    # ============================================================
    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin '*' always;

        # 常见媒体类型
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            video/mp4 mp4;
        }
    }

    # ============================================================
    # 默认: 返回 404
    # ============================================================
    location / {
        add_header Content-Type application/json;
        return 404 '{"error":"not_found","message":"Route not found"}';
    }
}
