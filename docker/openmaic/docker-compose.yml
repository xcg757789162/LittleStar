# ============================================================
# LittleStar 全栈 Docker Compose
# PostgreSQL + PostgREST + Auth Service + Nginx + OpenMAIC
# ============================================================

services:
  # ============================================================
  # PostgreSQL — 数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: littlestar-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-littlestar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 数据持久化
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本（按文件名顺序执行）
      - ../postgresql/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../postgresql/init/02-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ../postgresql/init/03-rls.sql:/docker-entrypoint-initdb.d/03-rls.sql:ro
      - ../postgresql/init/04-seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-littlestar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - littlestar-net

  # ============================================================
  # PostgREST — 自动 REST API
  # ============================================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: littlestar-postgrest
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-littlestar}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PGRST_SERVER_PORT: 3000
      PGRST_DB_POOL: 10
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - littlestar-net

  # ============================================================
  # Auth Service — JWT 认证服务
  # ============================================================
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: littlestar-auth
    environment:
      AUTH_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-littlestar}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - littlestar-net

  # ============================================================
  # Nginx — 反向代理统一入口
  # ============================================================
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: littlestar-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      postgrest:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      openmaic:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - littlestar-net

  # ============================================================
  # OpenMAIC — AI 课堂生成服务
  # ============================================================
  openmaic:
    image: devprincekumar/openmaic:latest
    container_name: openmaic-server
    env_file:
      - .env.local
    environment:
      PORT: 3002
    volumes:
      - openmaic-data:/app/data
      - openmaic-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - littlestar-net

# ============================================================
# 持久化卷
# ============================================================
volumes:
  postgres-data:
    driver: local
  openmaic-data:
    driver: local
  openmaic-logs:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  littlestar-net:
    driver: bridge
